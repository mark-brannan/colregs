name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the identifier-diff test (ADR 0006) compares
          # HEAD against the last release tag, and the default shallow, tagless
          # checkout would starve it of a baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # The prose-budget engine isn't on this runner; the `prose-budget` job
      # below is the gate for it, so the wrapper test skips here.
      - uses: mark-brannan/.github/.github/actions/npm-test-prose-fallback@29b5b7b2a6fe3b3ccd01a6283145c223a05b2023

  # Documentation gate: the shared prose-budget engine over docs/budgets.json.
  prose-budget:
    uses: mark-brannan/.github/.github/workflows/prose-budget.yml@v1

  # The single required status check, shared across repositories: the
  # `gate` job of mark-brannan/.github's reusable ci-gate workflow, which fails
  # unless every result in `needs` is green. The reported context is
  # "ci-gate / gate" -- GitHub names a reusable workflow's checks
  # "<caller job> / <called job>" -- and that is what the ruleset requires, so
  # this job's id is part of the contract. `always()` is what lets the gate
  # evaluate when a dependency failed or was skipped, so it reports an explicit
  # pass or fail of its own rather than inheriting the skip.
  ci-gate:
    needs: [test, prose-budget]
    if: always()
    # It reads nothing and writes nothing; the results go in as an input.
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
